service:
  name: budgetbuddy-analytics
image:
  repository: budgetbuddy/analytics
secretName: budgetbuddy-analytics-secret
config:
  ASPNETCORE_ENVIRONMENT: Production
  OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
  Seq__ServerUrl: "http://seq:5341"
autoscaling:
  minReplicas: 1
  maxReplicas: 4
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi
